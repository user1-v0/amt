[project]
name = "mr-amt-agent"
version = "0.1.0"
description = "Static Android malware analysis harness"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2.178",
    "dotenv>=0.9.9",
    "droidasc>=0.1.2",
    "fastapi>=0.162.0",
    "python-multipart>=0.0.33",
    "pyzipper>=0.4.0",
    "r2pipe>=1.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]
